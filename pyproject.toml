[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finaince"
version = "0.1.0"
description = "FinAlpha: fail-closed China sell-side research desk (factor catalog + 研报复现). Locked local_panel baseline, 0 bps."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pandas",
    "numpy",
    "loguru",
    "python-dotenv",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "fastapi",
    "uvicorn",
    "websockets",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
reproduction = [
    "reproagent @ git+https://github.com/WeissHymmnos/ReproAgent.git@18702585ed19f50c85c9dd9b023ebff2a09a56f7",
    "aiminer @ git+https://github.com/WeissHymmnos/aiminer.git@1b79d7be16647ae9bff423258ba08d4f0121ebd1",
    "finreportparser @ git+https://github.com/WeissHymmnos/finpdfpro.git@fb5314833a816d40201fb1173a6afe6788dfba2c",
]
discovery = [
    "aiminer @ git+https://github.com/WeissHymmnos/aiminer.git@1b79d7be16647ae9bff423258ba08d4f0121ebd1",
]
agent = [
    "claude-agent-sdk>=0.1.0",
]
all = [
    "finaince[reproduction,discovery,agent]",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.scripts]
finaince = "finaince.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/finaince"]

[tool.hatch.build.targets.wheel.sources]
"src/finaince" = "finaince"

[tool.hatch.build.targets.wheel.force-include]
"src/finaince/data/local_panel/prices.parquet" = "finaince/data/local_panel/prices.parquet"
"src/finaince/web/index.html" = "finaince/web/index.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: real PDF / RiceQuant / CPA DeepSeek calls (network, credentials)",
]
