<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FinAlpha desk</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root { color-scheme: light dark; }
      body { font: 14px/1.45 system-ui, sans-serif; margin: 0; }
      header { padding: 10px 16px; border-bottom: 1px solid #8884; display: flex; gap: 12px; align-items: center; }
      header input { flex: 1; max-width: 320px; padding: 4px 8px; }
      main { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 0; min-height: calc(100vh - 49px); }
      .folded { opacity: .55; }
      button:disabled { opacity: .4; }
      section { border-right: 1px solid #8884; padding: 12px; overflow-y: auto; max-height: calc(100vh - 49px); }
      h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; opacity: .7; margin: 4px 0 10px; }
      .card, .item { border: 1px solid #8886; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; }
      .tag { display: inline-block; border-radius: 999px; padding: 0 8px; margin-right: 4px; font-size: 11px; border: 1px solid #8886; }
      .tag.bad { border-color: #c0392b; color: #c0392b; }
      .tag.good { border-color: #1e8449; color: #1e8449; }
      button { padding: 3px 10px; margin-right: 6px; }
      pre { white-space: pre-wrap; font-size: 12px; }
      .muted { opacity: .65; }
    </style>
  </head>
  <body>
    <header>
      <strong>FinAlpha</strong>
      <input id="token" type="password" placeholder="desk token" />
      <button id="reload">reload</button>
      <span id="status" class="muted"></span>
    </header>
    <main>
      <section id="pane-catalog">
        <h2>Catalog</h2>
        <div id="catalog-list" class="muted">loading…</div>
      </section>
      <section id="pane-review">
        <h2>Review queue</h2>
        <div id="review-list" class="muted">loading…</div>
        <div id="gates-report"></div>
      </section>
      <section id="pane-trace">
        <h2>Trace chain</h2>
        <div id="trace-list" class="muted">loading…</div>
      </section>
      <section id="pane-jobs">
        <h2>Jobs</h2>
        <p class="muted">engine window cost citable. Gate failure unprovenanced. Job status, cancel, failure reason, trace id.</p>
        <div id="job-list" class="muted">loading…</div>
      </section>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      const preset = new URLSearchParams(location.search).get("token");
      if (preset) $("token").value = preset;
      const headers = () => {
        const token = $("token").value.trim();
        return token ? { "X-API-Key": token } : {};
      };
      async function get(path) {
        const res = await fetch(path, { headers: headers() });
        if (!res.ok) throw new Error(`${path}: ${res.status}`);
        return res.json();
      }
      async function post(path, body) {
        const res = await fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json", ...headers() },
          body: JSON.stringify(body || {}),
        });
        return { ok: res.ok, data: await res.json().catch(() => ({})) };
      }
      function tag(text, cls = "") { return `<span class="tag ${cls}">${text}</span>`; }

      async function loadCatalog() {
        const box = $("catalog-list");
        box.textContent = "loading…";
        try {
          const data = await get("/api/v1/catalog");
          box.textContent = "";
          for (const item of data.items || []) {
            const citable = item.citable === true;
            const tags = [
              item.status,
              `engine=${item.engine || "unknown"}`,
              `window=${item.window_start || "-"}→${item.window_end || "-"}`,
              `cost=${(item.metrics && item.metrics.cost_bps) ?? item.cost_bps ?? "-"}`,
              citable ? "citable" : "not citable",
              item.turnover_model ? `turnover_model=${item.turnover_model}` : "",
            ].filter(Boolean).map((t) => tag(t, citable ? "good" : "bad"));
            const card = document.createElement("div");
            card.className = citable ? "card" : "card folded";
            const formula = item.expression && item.expression.text ? item.expression.text : (item.formula || "");
            card.innerHTML = `<b>${item.name || item.id}</b><br/>${tags.join(" ")}<pre class="muted">${String(formula).replace(/</g, "&lt;")}</pre>`;
            card.onclick = () => showGates(item.id);
            box.append(card);
          }
        } catch (err) { box.textContent = String(err); }
      }

      async function loadReview() {
        const box = $("review-list");
        box.textContent = "loading…";
        try {
          const data = await get("/api/v1/review");
          box.textContent = "";
          for (const promo of data.items || []) {
            const row = document.createElement("div");
            row.className = "item";
            let failureNames = [];
            let failureDetail = "";
            try {
              const gates = await get(`/api/v1/review/${promo.id}/gates`);
              failureNames = gates.failures || [];
              failureDetail = JSON.stringify(gates.details || {});
            } catch (err) {
              failureNames = [];
              failureDetail = String(err);
            }
            const failureText = failureNames.length ? failureNames.join(" ") : "none";
            row.innerHTML = `${promo.catalog_id}<br/><span class="muted">${promo.direction} · ${(promo.created_at || "").slice(0, 19)}</span><br/>
              <span class="gate-failures">${failureText}</span>
              <pre class="muted gate-detail">${failureDetail.replace(/</g, "&lt;")}</pre>
              <button data-act="gates">gates</button>
              <button data-act="adversary">adversary</button>
              <button data-act="approve" disabled>approve</button>
              <button data-act="reject">reject</button>`;
            row.querySelector('[data-act="gates"]').onclick = () => showGates(promo.catalog_id, promo.id);
            row.querySelector('[data-act="adversary"]').onclick = async () => {
              $("status").textContent = "adversary running…";
              const out = await post(`/api/v1/review/${promo.id}/adversary`);
              const verdict = (out.data && (out.data.verdict || (out.data.gates && out.data.gates.adversary && out.data.gates.adversary.verdict))) || "";
              $("status").textContent = `adversary ${verdict || (out.ok ? "ok" : "failed")}`;
              if (verdict === "approved") row.querySelector('[data-act="approve"]').disabled = false;
              showGates(promo.catalog_id, promo.id);
            };
            row.querySelector('[data-act="approve"]').onclick = async () => {
              const out = await post(`/api/v1/review/${promo.id}/approve`);
              $("status").textContent = out.ok ? "approved" : `blocked: ${(out.data.gates?.failures || []).join(",")}`;
              loadReview();
            };
            row.querySelector('[data-act="reject"]').onclick = async () => {
              await post(`/api/v1/review/${promo.id}/reject`);
              loadReview();
            };
            box.append(row);
          }
        } catch (err) { box.textContent = String(err); }
      }

      async function showGates(catalogId, promotionId) {
        const report = $("gates-report");
        report.textContent = "…";
        try {
          let url;
          if (promotionId) url = `/api/v1/review/${promotionId}/gates`;
          else {
            const promos = (await get("/api/v1/review")).items || [];
            const match = promos.find((p) => p.catalog_id === catalogId);
            if (!match) { report.textContent = "no pending promotion for this record"; return; }
            url = `/api/v1/review/${match.id}/gates`;
          }
          const gates = await get(url);
          const failures = (gates.failures || []).map((f) => tag(f, "bad")).join(" ") || tag("passed", "good");
          const detail = gates.details || {};
          report.innerHTML = `<div class="card"><b>${gates.promotion_id}</b> ${failures}
            <div class="muted">failure detail</div>
            <pre>${JSON.stringify(detail, null, 1).replace(/</g, "&lt;")}</pre></div>`;
        } catch (err) { report.textContent = String(err); }
      }

      async function loadTrace() {
        const box = $("trace-list");
        box.textContent = "loading…";
        try {
          const data = await get("/api/v1/trace?limit=30");
          box.textContent = "";
          for (const ev of data.items || []) {
            const item = document.createElement("div");
            item.className = "item";
            item.innerHTML = `<b>${ev.action}</b> ${ev.ok === false ? tag("fail", "bad") : ""}
              <span class="muted">${ev.ts || ""}</span><br/>
              <span class="muted">${String(ev.hypothesis || ev.summary || "").slice(0, 140).replace(/</g, "&lt;")}</span>`;
            box.append(item);
          }
        } catch (err) { box.textContent = String(err); }
      }

      async function loadJobs() {
        const box = $("job-list");
        box.textContent = "loading…";
        try {
          const data = await get("/api/v1/jobs");
          box.textContent = "";
          const items = data.items || [];
          if (!items.length) {
            box.innerHTML = `<div class="item">status <span class="muted">none</span><br/>failure reason <span class="muted">—</span><br/>trace id <span class="muted">—</span> <button disabled>cancel</button></div>`;
            return;
          }
          for (const job of items) {
            const item = document.createElement("div");
            item.className = "item";
            const status = job.status || "unknown";
            const reason = job.error || job.failure_reason || "—";
            const trace = job.trace_id || (job.result && job.result.trace_id) || "—";
            item.innerHTML = `status <b class="job-status">${status}</b><br/>failure reason <span class="muted">${String(reason).replace(/</g, "&lt;")}</span><br/>trace id <span class="muted">${String(trace).replace(/</g, "&lt;")}</span> <button data-act="cancel">cancel</button>`;
            item.querySelector('[data-act="cancel"]').onclick = async () => {
              await post(`/api/v1/jobs/${job.id}/cancel`);
              loadJobs();
            };
            box.append(item);
          }
        } catch (err) { box.textContent = String(err); }
      }

      function reloadAll() { loadCatalog(); loadReview(); loadTrace(); loadJobs(); $("gates-report").textContent = ""; }
      $("reload").onclick = reloadAll;
      reloadAll();
    </script>
  </body>
</html>
