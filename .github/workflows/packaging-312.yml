name: packaging-312
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  isolated-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout finaince
        uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Public install extras without path hack
        env:
          FINAINCE_NO_PATH_HACK: "1"
        run: |
          uv venv --python 3.12
          uv pip install -e ".[reproduction]"
          .venv/bin/python -c "import finaince, reproagent; from aiminer.manager import cull_alpha_pool; print('ok', cull_alpha_pool)"
