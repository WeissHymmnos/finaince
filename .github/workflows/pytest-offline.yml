name: pytest-offline
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout finaince
        uses: actions/checkout@v4
        with:
          path: finaince
      - name: Checkout public ReproAgent
        uses: actions/checkout@v4
        with:
          repository: WeissHymmnos/ReproAgent
          ref: 18702585ed19f50c85c9dd9b023ebff2a09a56f7
          path: reproagent
          persist-credentials: false
      - name: Checkout public slim aiminer
        uses: actions/checkout@v4
        with:
          repository: WeissHymmnos/aiminer
          ref: 99e0924e41cc6c8d70d7670cdf1cf0c63bb3aeaa
          path: aiminer
          persist-credentials: false
      - name: Checkout public finpdfpro
        uses: actions/checkout@v4
        with:
          repository: WeissHymmnos/finpdfpro
          ref: fb5314833a816d40201fb1173a6afe6788dfba2c
          path: finpdfpro
          persist-credentials: false
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build workbench SPA
        working-directory: aiminer/frontend
        run: |
          npm install
          npm run build
          test -f dist/index.html
          ls dist/assets | grep -E 'CatalogPage-|ReviewPage-|ReproducePage-|AgentPage-'
      - name: Install public extras and run offline pytest
        working-directory: finaince
        env:
          FINAINCE_NO_PATH_HACK: "1"
          ALLOW_MOCK_LLM: "true"
        run: |
          uv venv --python 3.12
          uv pip install -e ".[reproduction,dev,agent]"
          uv pip install -e ../finpdfpro
          .venv/bin/python -c "import finreportparser; from pathlib import Path; p=Path(finreportparser.__file__); print(finreportparser.__version__, p); assert 'finpdfpro' in str(p) or str(finreportparser.__version__).startswith('0.5')"
          .venv/bin/python -m pytest tests --ignore=tests/test_live_real.py -m "not live" -q --tb=short
      - name: Ruff lint (non-blocking on stock warnings)
        continue-on-error: true
        run: .venv/bin/python -m ruff check src tests
